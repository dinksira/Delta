services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: deltalabs
      MINIO_ROOT_PASSWORD: deltalabssecret
    volumes:
      - minio_data:/data

  # Creates bucket + anonymous download policy for local progressive playback.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 deltalabs deltalabssecret;
      mc mb -p local/delta-labs-media || true;
      mc anonymous set download local/delta-labs-media;
      echo 'MinIO bucket ready: delta-labs-media';
      "

volumes:
  minio_data:
