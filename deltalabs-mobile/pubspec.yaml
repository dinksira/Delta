name: deltalabs_mobile
description: DeltaLabs — Enterprise Multi-Tenant Educational Ecosystem
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  hooks_riverpod: ^3.0.0
  flutter_hooks: ^0.21.0

  # ── Routing ───────────────────────────────────────────────────────────────
  go_router: ^14.6.3

  # ── Network ───────────────────────────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.1

  # ── Local Database (Offline-First) ────────────────────────────────────────
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Secure Storage ────────────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3

  # ── Realtime / WebSocket ──────────────────────────────────────────────────
  web_socket_channel: ^3.0.2
  socket_io_client: ^2.0.3+1

  # ── Media / Video ─────────────────────────────────────────────────────────
  video_player: ^2.9.2
  chewie: ^1.8.5
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # ── UI / Design System ────────────────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17

  # ── Utilities ─────────────────────────────────────────────────────────────
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  equatable: ^2.0.7
  dartz: ^0.10.1
  rxdart: ^0.28.0
  collection: ^1.19.1
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0

  # ── Dependency Injection ──────────────────────────────────────────────────
  get_it: ^8.0.3

  # ── Analytics / Crash Reporting ───────────────────────────────────────────
  # Uncomment after running `flutterfire configure`
  # firebase_core: ^3.13.0
  # firebase_crashlytics: ^4.3.0
  # firebase_analytics: ^11.4.0
  # firebase_remote_config: ^5.4.0
  # firebase_messaging: ^15.2.5

  # ── Permissions ───────────────────────────────────────────────────────────
  permission_handler: ^11.4.0

  # ── Background Tasks ──────────────────────────────────────────────────────
  workmanager: ^0.9.0

  # ── App Lifecycle / Deep Links ────────────────────────────────────────────
  app_links: ^6.4.0
  package_info_plus: ^8.3.0
  device_info_plus: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.14
  riverpod_generator: ^3.0.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  retrofit_generator: ^10.2.1
  drift_dev: ^2.22.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.0.0

  # ── Testing ───────────────────────────────────────────────────────────────
  mocktail: ^1.0.4
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/play_store_512.png"
  min_sdk_android: 21
