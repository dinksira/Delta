targets:
  $default:
    builders:
      # Riverpod code generation
      riverpod_generator:
        options:
          riverpod_version: 2

      # Freezed
      freezed:
        options:
          map: true
          when: true
          maybeWhen: true
          mapOrNull: true
          maybeMap: true

      # JSON serializable
      json_serializable:
        options:
          explicit_to_json: true
          include_if_null: false
          field_rename: snake

      # Drift
      drift_dev:
        options:
          sql:
            dialects:
              - sqlite
          store_date_time_values_as_text: true
